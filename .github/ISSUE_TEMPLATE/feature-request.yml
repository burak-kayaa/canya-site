name: Feature request
description: Suggest something Canya should do.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or task, in your own words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
