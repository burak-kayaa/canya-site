name: Bug report
description: Something in Canya does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Canya → **Settings → Feedback → Copy** gives you the version and OS to paste below.
  - type: input
    id: version
    attributes:
      label: Canya version
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15 / Windows 11 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. …
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, a sample .canya file, or the diagnostics text from Settings → Feedback.
